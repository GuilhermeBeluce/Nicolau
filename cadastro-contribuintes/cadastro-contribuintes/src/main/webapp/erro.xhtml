<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/principal.xhtml">

    <ui:define name="titulo">Ocorreu um erro</ui:define>

    <ui:define name="breadcrumb">
        <span class="breadcrumb-item breadcrumb-atual">Erro</span>
    </ui:define>

    <ui:define name="conteudo">
        <section class="cartao">
            <h1>Não foi possível concluir a operação</h1>

            <h:link outcome="/index" styleClass="botao botao-secundario">Voltar ao início</h:link>
        </section>
    </ui:define>

</ui:composition>
